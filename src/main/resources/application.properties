spring.application.name=order-service
server.port=${ORDER_SERVER_PORT:8083}

spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/order_service}
spring.datasource.username=${ORDER_DB_USERNAME:order_user}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

security.jwt.issuer=${AUTH_ISSUER_URI:http://localhost:8081}
security.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
security.jwt.audience=${AUTH_AUDIENCE:platform-api}
security.default-tenant=${ORDER_DEFAULT_TENANT:default}

catalog.base-url=${CATALOG_SERVICE_URI:http://localhost:8082}
catalog.connect-timeout=${CATALOG_CONNECT_TIMEOUT:2s}
catalog.read-timeout=${CATALOG_READ_TIMEOUT:3s}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.isolation.level=read_committed
orders.kafka.payment-outcomes.enabled=${ORDER_PAYMENT_OUTCOMES_KAFKA_ENABLED:false}
orders.kafka.payment-outcomes.topic=${ORDER_PAYMENT_OUTCOMES_KAFKA_TOPIC:payments.outcomes.v1}
orders.kafka.payment-outcomes.consumer-group=${ORDER_PAYMENT_OUTCOMES_KAFKA_GROUP:order-service-payment-outcomes-v1}
orders.kafka.payment-outcomes.concurrency=${ORDER_PAYMENT_OUTCOMES_KAFKA_CONCURRENCY:1}
